name: iOS Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Career App Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode and simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('career-app.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project career-app.xcodeproj \
            -scheme "Career App Unit Tests"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project career-app.xcodeproj \
            -scheme "Career App Unit Tests" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee raw-test-output.log | xcbeautify --renderer github-actions

      - name: Upload raw test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-output
          path: raw-test-output.log

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
